<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F5">
<title>Ссылка недействительна — Машинист</title>
<meta name="description" content="Срок действия ссылки для восстановления пароля истёк.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F3F5; --surface:#FFFFFF; --ink:#0A0E14;
    --muted:rgba(10,14,20,.56); --faint:rgba(10,14,20,.40);
    --border:rgba(10,14,20,.08); --borderStrong:rgba(10,14,20,.14);
    --accent:#00A0F5; --accentHover:#0091D9; --accentSoft:rgba(0,160,245,.10);
    --success:#00B341; --warning:#FF8A00;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accentHover)}
  svg{display:block}
  h1{margin:0;text-wrap:pretty}
  .wrap{max-width:1200px;margin:0 auto;padding:0 40px}
  .site-head{border-bottom:1px solid var(--border);background:var(--surface)}
  .site-head .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
  .brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
  .brand:hover{color:var(--ink)}
  .brand span{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
  .back:hover{color:var(--ink)}
  .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 20px 72px}
  .auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
    border-radius:24px;padding:44px 36px;box-shadow:0 22px 50px rgba(10,14,20,.06);text-align:center}
  .status-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;margin:0 auto 24px}
  .status-icon svg{width:32px;height:32px}
  .status-icon--warn{background:rgba(255,138,0,.12);color:var(--warning)}
  .auth-card h1{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-bottom:12px}
  .auth-sub{font-size:15px;color:var(--muted);line-height:1.6;margin:0 0 28px}
  .auth-support{font-size:14px;color:var(--muted)}
  .auth-support a{font-weight:600}
  @media(max-width:1024px){.wrap{padding:0 28px}}
  @media(max-width:680px){.wrap{padding:0 20px}}
  @media(max-width:480px){.auth-card{padding:36px 22px}}
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a href="https://locodriver.ru" class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><text x="16" y="16.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="29" letter-spacing="-1.2" fill="currentColor">М</text></svg>
      <span>Машинист</span>
    </a>
    <a href="https://locodriver.ru" class="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg> На сайт
    </a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="status-icon status-icon--warn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </div>
    <h1>Срок действия ссылки истёк</h1>
    <p class="auth-sub">Ссылка для восстановления пароля действует ограниченное время. Запросите восстановление ещё раз в приложении «Машинист» — на почту придёт новое письмо.</p>
    <div class="auth-support">Нужна помощь? <a href="mailto:locodriver.app@yandex.ru">locodriver.app@yandex.ru</a></div>
  </div>
</main>
</body>
</html>
