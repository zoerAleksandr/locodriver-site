<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F5">
<title>Пароль изменён — Машинист</title>
<meta name="description" content="Пароль для приложения «Машинист» успешно изменён.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F3F5; --surface:#FFFFFF; --ink:#0A0E14;
    --muted:rgba(10,14,20,.56); --faint:rgba(10,14,20,.40);
    --border:rgba(10,14,20,.08); --borderStrong:rgba(10,14,20,.14);
    --accent:#00A0F5; --accentHover:#0091D9; --accentSoft:rgba(0,160,245,.10);
    --success:#00B341; --warning:#FF8A00;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accentHover)}
  svg{display:block}
  h1{margin:0;text-wrap:pretty}
  .wrap{max-width:1200px;margin:0 auto;padding:0 40px}
  .site-head{border-bottom:1px solid var(--border);background:var(--surface)}
  .site-head .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
  .brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
  .brand:hover{color:var(--ink)}
  .brand span{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
  .back:hover{color:var(--ink)}
  .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 20px 72px}
  .auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
    border-radius:24px;padding:44px 36px;box-shadow:0 22px 50px rgba(10,14,20,.06);text-align:center}
  .status-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;margin:0 auto 24px}
  .status-icon svg{width:32px;height:32px}
  .status-icon--ok{background:rgba(0,179,65,.12);color:var(--success)}
  .auth-card h1{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-bottom:12px}
  .auth-sub{font-size:15px;color:var(--muted);line-height:1.6;margin:0 0 28px}
  .auth-btn{display:inline-block;padding:13px 24px;border-radius:14px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:700;font-family:var(--sans);border:none;cursor:pointer}
  .auth-btn:hover{background:var(--accentHover);color:#fff}
  .auth-alt{display:block;margin-top:16px;font-size:14px;color:var(--muted);font-weight:600}
  @media(max-width:1024px){.wrap{padding:0 28px}}
  @media(max-width:680px){.wrap{padding:0 20px}}
  @media(max-width:480px){.auth-card{padding:36px 22px}}
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a href="https://locodriver.ru" class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><text x="16" y="16.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="29" letter-spacing="-1.2" fill="currentColor">М</text></svg>
      <span>Машинист</span>
    </a>
    <a href="https://locodriver.ru" class="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg> На сайт
    </a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="status-icon status-icon--ok">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>Пароль изменён</h1>
    <p class="auth-sub">Новый пароль сохранён. Вернитесь в приложение «Машинист» и войдите с ним.</p>
    <button class="auth-btn" id="open-app" type="button">Вернуться в приложение</button>
    <a class="auth-alt" href="https://locodriver.ru">Открыть сайт</a>
  </div>
</main>

<script>
(function () {
  // Куда возвращаемся в приложении (кастомная схема «Машиниста»).
  var APP_URL = "locodriver://profile";

  var STORE_ANDROID = "https://www.rustore.ru/catalog/app/com.z_company.loco_driver";
  var STORE_IOS     = "https://locodriver.ru"; // TODO: заменить на App Store, когда выйдет iOS-версия
  var STORE_FALLBACK = STORE_ANDROID;          // десктоп и прочее

  function storeUrl() {
    var ua = navigator.userAgent || "";
    if (/android/i.test(ua)) return STORE_ANDROID;
    // iPad на iOS 13+ маскируется под Mac — ловим по тач-скрину
    if (/iphone|ipad|ipod/i.test(ua) ||
        (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) return STORE_IOS;
    return STORE_FALLBACK;
  }

  var btn = document.getElementById("open-app");
  if (!btn) return;

  btn.addEventListener("click", function () {
    var target = storeUrl();
    var didHide = false;

    // Если приложение открылось — вкладка уходит в фон, отменяем редирект в стор.
    function onVisibility() { if (document.hidden) didHide = true; }
    function markHidden() { didHide = true; }
    document.addEventListener("visibilitychange", onVisibility);
    window.addEventListener("pagehide", markHidden);
    window.addEventListener("blur", markHidden);

    setTimeout(function () {
      document.removeEventListener("visibilitychange", onVisibility);
      window.removeEventListener("pagehide", markHidden);
      window.removeEventListener("blur", markHidden);
      if (!didHide) window.location.href = target; // приложения нет — уводим в стор
    }, 1500);

    // Пытаемся открыть приложение.
    window.location.href = APP_URL;
  });
})();
</script>
</body>
</html>
