<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F5">
<title>Восстановление пароля — Машинист</title>
<meta name="description" content="Восстановление пароля для приложения «Машинист».">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Самодостаточная страница: стили сайта встроены, чтобы отдавать её
     как шаблон с бэкенда (/v1/page/reset_password_template) без внешних файлов. */
  :root{
    --bg:#F2F3F5; --surface:#FFFFFF; --ink:#0A0E14;
    --muted:rgba(10,14,20,.56); --faint:rgba(10,14,20,.40);
    --border:rgba(10,14,20,.08); --borderStrong:rgba(10,14,20,.14);
    --accent:#00A0F5; --accentHover:#0091D9; --accentSoft:rgba(0,160,245,.10);
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accentHover)}
  svg{display:block}
  h1{margin:0;text-wrap:pretty}

  .wrap{max-width:1200px;margin:0 auto;padding:0 40px}

  /* Шапка «Машинист» */
  .site-head{border-bottom:1px solid var(--border);background:var(--surface)}
  .site-head .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
  .brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
  .brand:hover{color:var(--ink)}
  .brand span{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
  .back:hover{color:var(--ink)}

  /* Карточка-форма */
  .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 20px 72px}
  .auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
    border-radius:24px;padding:40px 36px;box-shadow:0 22px 50px rgba(10,14,20,.06)}
  .auth-kick{font-family:var(--mono);font-size:12px;letter-spacing:1.6px;color:var(--accent);
    text-transform:uppercase;margin-bottom:12px}
  .auth-card h1{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-bottom:10px}
  .auth-sub{font-size:15px;color:var(--muted);line-height:1.55;margin:0 0 28px}
  .auth-form{display:flex;flex-direction:column;gap:12px}
  .auth-input{position:relative}
  .auth-field{width:100%;padding:14px 52px 14px 16px;background:var(--bg);color:var(--ink);
    border:1px solid var(--borderStrong);border-radius:14px;font-family:var(--sans);font-size:16px;
    outline:none;transition:border-color .2s,box-shadow .2s}
  .auth-field::placeholder{color:var(--faint)}
  .auth-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
  /* спрятать нативную «глаз»-иконку в Edge/IE, чтобы не дублировать */
  .auth-field::-ms-reveal,.auth-field::-ms-clear{display:none}
  .auth-toggle{position:absolute;top:0;right:0;height:100%;width:48px;display:flex;
    align-items:center;justify-content:center;border:none;background:none;padding:0;margin:0;
    color:var(--faint);cursor:pointer;transition:color .2s}
  .auth-toggle:hover{color:var(--muted)}
  .auth-toggle svg{width:20px;height:20px}
  .auth-toggle .icon-off{display:none}
  .auth-toggle.is-on .icon-on{display:none}
  .auth-toggle.is-on .icon-off{display:block}
  .auth-submit{margin-top:8px;width:100%;padding:14px;border:none;border-radius:14px;
    background:var(--accent);color:#fff;font-family:var(--sans);font-size:15px;font-weight:700;
    cursor:pointer;transition:background .2s}
  .auth-submit:hover{background:var(--accentHover)}
  .auth-support{margin-top:28px;text-align:center;font-size:14px;color:var(--muted)}
  .auth-support a{font-weight:600}

  @media(max-width:1024px){.wrap{padding:0 28px}}
  @media(max-width:680px){.wrap{padding:0 20px}}
  @media(max-width:480px){.auth-card{padding:32px 22px}}
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a href="https://locodriver.ru" class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><text x="16" y="16.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="29" letter-spacing="-1.2" fill="currentColor">М</text></svg>
      <span>Машинист</span>
    </a>
    <a href="https://locodriver.ru" class="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg> На сайт
    </a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-kick">Восстановление доступа</div>
    <h1>Восстановление пароля</h1>
    <p class="auth-sub">Придумайте новый пароль для входа в приложение «Машинист».</p>
    <form class="auth-form" id="resetForm" action="https://api.locodriver.ru/v1/page/reset_password" method="post">
      <div class="auth-input">
        <input class="auth-field" type="password" name="new_password" id="password" placeholder="Новый пароль" autocomplete="new-password" minlength="4" required>
        <button class="auth-toggle" type="button" aria-label="Показать пароль" aria-pressed="false" data-target="password">
          <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.06 3.06M6.06 6.06A17.6 17.6 0 0 0 2 12s3.5 7 10 7a9.1 9.1 0 0 0 3.06-.52M9.9 9.9a3 3 0 0 0 4.24 4.24"/><path d="M2 2l20 20"/></svg>
        </button>
      </div>
      <div class="auth-input">
        <input class="auth-field" type="password" name="confirm_password" id="confirm_password" placeholder="Подтвердите пароль" autocomplete="new-password" required>
        <button class="auth-toggle" type="button" aria-label="Показать пароль" aria-pressed="false" data-target="confirm_password">
          <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.06 3.06M6.06 6.06A17.6 17.6 0 0 0 2 12s3.5 7 10 7a9.1 9.1 0 0 0 3.06-.52M9.9 9.9a3 3 0 0 0 4.24 4.24"/><path d="M2 2l20 20"/></svg>
        </button>
      </div>
      <button class="auth-submit" type="submit">Подтвердить</button>
    </form>
    <div class="auth-support"><a href="mailto:locodriver.app@yandex.ru">locodriver.app@yandex.ru</a></div>
  </div>
</main>

<script>
  var form = document.getElementById("resetForm");
  var password = document.getElementById("password");
  var confirm_password = document.getElementById("confirm_password");

  // Обработчик смены пароля на сервере (https, поддомен locodriver.ru).
  var API_RESET_URL = "https://api.locodriver.ru/v1/page/reset_password";

  // Токен приходит в адресе ссылки из письма (?access_token=…) и переносится
  // в action формы — POST на <API_RESET_URL>?access_token=… (логика прежняя).
  var token = new URLSearchParams(location.search).get("access_token");
  if (token) {
    form.setAttribute("action", API_RESET_URL + "?access_token=" + encodeURIComponent(token));
  }

  function validatePassword() {
    if (password.value.length > 0 && password.value.length < 4) {
      password.setCustomValidity("Пароль должен содержать не менее 4 символов");
    } else {
      password.setCustomValidity("");
    }
    if (password.value != confirm_password.value) {
      confirm_password.setCustomValidity("Пароли не совпадают");
    } else {
      confirm_password.setCustomValidity("");
    }
  }

  password.oninput = validatePassword;
  confirm_password.oninput = validatePassword;

  // Показать/скрыть пароль
  Array.prototype.forEach.call(document.querySelectorAll(".auth-toggle"), function (btn) {
    btn.addEventListener("click", function () {
      var field = document.getElementById(btn.getAttribute("data-target"));
      var show = field.type === "password";
      field.type = show ? "text" : "password";
      btn.classList.toggle("is-on", show);
      btn.setAttribute("aria-pressed", show ? "true" : "false");
      btn.setAttribute("aria-label", show ? "Скрыть пароль" : "Показать пароль");
    });
  });

  // Надёжная отправка. Страница на locodriver.ru, а POST идёт на
  // api.locodriver.ru — оба за одним Cloudflare edge с общим сертификатом,
  // поэтому браузер коалесцирует соединения и может переиспользовать уже
  // «протухшее» (простаивавшее, пока вводили пароль) keep-alive соединение.
  // POST при этом обрывается («сервер неожиданно отключился»), а POST браузер
  // НЕ повторяет автоматически. Поэтому перед отправкой «прогреваем» соединение
  // идемпотентным GET — его браузер сам повторит на свежем соединении, — и лишь
  // затем отправляем форму нативно: POST уходит по заведомо живому соединению.
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    validatePassword();
    if (!form.reportValidity()) return;

    var submitBtn = form.querySelector(".auth-submit");
    submitBtn.disabled = true;
    submitBtn.textContent = "Отправляем…";

    var sent = false;
    function send() {
      if (sent) return;
      sent = true;
      HTMLFormElement.prototype.submit.call(form);
    }
    try {
      fetch(API_RESET_URL, { method: "GET", mode: "no-cors", cache: "no-store" })
        .then(send, send);
      // страховка: если прогрев завис — отправляем всё равно
      setTimeout(send, 3000);
    } catch (_) {
      send();
    }
  });
</script>
</body>
</html>
