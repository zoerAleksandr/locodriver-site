<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F5">
<title>Восстановление пароля — Машинист</title>
<meta name="description" content="Восстановление пароля для приложения «Машинист».">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* ── Страница-форма (восстановление пароля) ── */
  body{min-height:100vh;display:flex;flex-direction:column}
  .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 20px 72px}
  .auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
    border-radius:24px;padding:40px 36px;box-shadow:0 22px 50px rgba(10,14,20,.06)}
  .auth-kick{font-family:var(--mono);font-size:12px;letter-spacing:1.6px;color:var(--accent);
    text-transform:uppercase;margin-bottom:12px}
  .auth-card h1{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-bottom:10px}
  .auth-sub{font-size:15px;color:var(--muted);line-height:1.55;margin:0 0 28px}
  .auth-form{display:flex;flex-direction:column;gap:12px}
  .auth-field{width:100%;padding:14px 16px;background:var(--bg);color:var(--ink);
    border:1px solid var(--borderStrong);border-radius:14px;font-family:var(--sans);font-size:16px;
    outline:none;transition:border-color .2s,box-shadow .2s}
  .auth-field::placeholder{color:var(--faint)}
  .auth-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
  .auth-submit{margin-top:8px;width:100%;padding:14px;border:none;border-radius:14px;
    background:var(--accent);color:#fff;font-family:var(--sans);font-size:15px;font-weight:700;
    cursor:pointer;transition:background .2s}
  .auth-submit:hover{background:var(--accentHover)}
  .auth-support{margin-top:28px;text-align:center;font-size:14px;color:var(--muted)}
  .auth-support a{font-weight:600}
</style>
</head>
<body>
<header class="legal-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><text x="16" y="16.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="29" letter-spacing="-1.2" fill="currentColor">М</text></svg>
      <span>Машинист</span>
    </a>
    <a href="index.html" class="legal-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg> На главную
    </a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-kick">Восстановление доступа</div>
    <h1>Восстановление пароля</h1>
    <p class="auth-sub">Придумайте новый пароль для входа в приложение «Машинист».</p>
    <form class="auth-form" id="resetForm" action="reset_password" method="post">
      <input class="auth-field" type="password" name="new_password" id="password" placeholder="Новый пароль" autocomplete="new-password" minlength="4" required>
      <input class="auth-field" type="password" name="confirm_password" id="confirm_password" placeholder="Подтвердите пароль" autocomplete="new-password" required>
      <button class="auth-submit" type="submit">Подтвердить</button>
    </form>
    <div class="auth-support"><a href="mailto:locodriver.app@yandex.ru">locodriver.app@yandex.ru</a></div>
  </div>
</main>

<script>
  var form = document.getElementById("resetForm");
  var password = document.getElementById("password");
  var confirm_password = document.getElementById("confirm_password");

  // Токен приходит в адресе ссылки из письма (?access_token=…) и переносится
  // в action формы — POST на reset_password?access_token=… (логика прежняя).
  var token = new URLSearchParams(location.search).get("access_token");
  if (token) {
    form.setAttribute("action", "reset_password?access_token=" + encodeURIComponent(token));
  }

  function validatePassword() {
    if (password.value.length > 0 && password.value.length < 4) {
      password.setCustomValidity("Пароль должен содержать не менее 4 символов");
    } else {
      password.setCustomValidity("");
    }
    if (password.value != confirm_password.value) {
      confirm_password.setCustomValidity("Пароли не совпадают");
    } else {
      confirm_password.setCustomValidity("");
    }
  }

  password.oninput = validatePassword;
  confirm_password.oninput = validatePassword;
</script>
</body>
</html>
